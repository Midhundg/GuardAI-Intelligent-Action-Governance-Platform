version: "1.0"
source: yaml
description: >
  GuardAI runtime action guardrail policy ruleset.
  Evaluated pre-execution before any tool call is dispatched.

rules:
  - id: "yaml-001"
    name: "Bulk Database Delete Block"
    description: "Block any database delete where record count is 500 or more."
    action: delete_database
    condition:
      type: record_count_gt
      value: 499
    decision: block

  - id: "yaml-002"
    name: "External Email Block"
    description: "Block any email sent to a domain other than company.com."
    action: send_email
    condition:
      type: email_domain_not_contains
      value: "company.com"
    decision: block

  - id: "yaml-003"
    name: "Confidential File Read Requires Approval"
    description: "Require HITL for any read of a path containing the word confidential."
    action: read_file
    condition:
      type: path_contains
      value: confidential
    decision: require_hitl
