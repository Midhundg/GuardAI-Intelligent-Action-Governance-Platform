version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: guardai_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - app

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardai_app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:ro
    environment:
      - APP_NAME=GuardAI Enterprise
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://guardai_user:guardai_password@postgres:5432/guardai_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=guardai-enterprise-production-secret-key-32bytes!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardai_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app:ro
    environment:
      - DATABASE_URL=postgresql://guardai_user:guardai_password@postgres:5432/guardai_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: guardai_postgres
    environment:
      POSTGRES_USER: guardai_user
      POSTGRES_PASSWORD: guardai_password
      POSTGRES_DB: guardai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardai_user -d guardai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: guardai_redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: guardai_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  postgres_data:
